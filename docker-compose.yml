services:
  rutaec:
    build: .
    ports: ["3000:3000"]
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      DEMO_MODE: ${DEMO_MODE:-true}
    volumes:
      - rutaec-data:/data
      - rutaec-uploads:/app/uploads
volumes:
  rutaec-data:
  rutaec-uploads:
