name: CI
on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [22, 24] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm test
      - name: Verificar que el servidor arranca y siembra datos
        run: |
          PORT=3999 DATA_DIR=$RUNNER_TEMP/rutaec node server/index.js &
          for i in $(seq 1 30); do curl -sf localhost:3999/api/health && break; sleep 1; done
          curl -fsS http://localhost:3999/api/health
          curl -fsS "http://localhost:3999/api/config" | grep -q RutaEC
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
